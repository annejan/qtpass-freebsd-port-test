---
# Test bed for the FreeBSD port sysutils/qtpass.
#
# Applies a port patch (the same diff that goes to Bugzilla) to a fresh
# checkout of the FreeBSD ports tree inside a FreeBSD VM, then runs what a
# ports committer would: portlint, checksum/makesum, stage, check-plist,
# stage-qa, package + install, and QtPass's own test suite on the port's build
# tree. Matrix: amd64 on the current 14.x and 15.x releases, aarch64 on 14.x
# (emulated, slow). A second job runs poudriere testport in a clean jail with
# only the port's declared dependencies (amd64, and i386 as a native jail on
# the amd64 host). A third job tests the OpenBSD port (security/qtpass) with
# its own patch from patches/openbsd/.
name: sysutils/qtpass port test

on:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/port-test.yml"
  workflow_dispatch:
    inputs:
      patch:
        description: "Port patch to test (path in this repository)"
        required: true
        default: "patches/qtpass-1.8.0.patch"
      ports_ref:
        description: "FreeBSD ports branch to apply it to (main, 2026Q3, ...)"
        required: true
        default: "main"
      run_suite:
        description: "Run QtPass's test suite on the port's build tree"
        type: boolean
        default: true
      openbsd_patch:
        description: "OpenBSD port patch to test (path in this repository; empty = newest in patches/openbsd/)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  port:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14.5", arch: x86_64 }
          - { release: "15.1", arch: x86_64 }
          - { release: "14.5", arch: aarch64 }
    env:
      # On push the newest patch in patches/ is tested.
      PATCH: ${{ inputs.patch }}
      PORTS_REF: ${{ inputs.ports_ref || 'main' }}
      RUN_SUITE: ${{ inputs.run_suite == '' && 'true' || inputs.run_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the patch
        id: pick
        run: |
          set -eu
          if [ -z "${PATCH}" ]; then
            PATCH=$(ls patches/*.patch | sort -V | tail -1)
          fi
          test -f "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Testing $PATCH against ports/$PORTS_REF"
      - name: Build and test the port in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          envs: "PORTS_REF RUN_SUITE"
          prepare: |
            pkg install -y git portlint qt6-base qt6-tools qt6-svg qt6-translations password-store libglvnd gnupg desktop-file-utils
            # the stricter checks a committer runs (stage-qa, check-plist, ...)
            echo DEVELOPER=yes >> /etc/make.conf
          run: |
            set -e
            freebsd-version
            WS="$(pwd)"
            PATCH="$WS/${{ steps.pick.outputs.patch }}"
            git clone --quiet --depth 1 --branch "$PORTS_REF" --filter=blob:none --sparse https://git.FreeBSD.org/ports.git /usr/ports
            cd /usr/ports
            git sparse-checkout set Mk Templates Keywords \
              sysutils/qtpass sysutils/password-store \
              devel/qt6-base devel/qt6-tools graphics/qt6-svg misc/qt6-translations \
              graphics/libglvnd devel/desktop-file-utils
            git log --oneline -1
            echo "=== apply the patch"
            if git apply --check "$PATCH"; then
              git apply "$PATCH"
            elif git apply --check --reverse "$PATCH"; then
              echo "patch is already in ports/$PORTS_REF; testing the tree as committed"
            else
              exit 1
            fi
            git status --short
            cd sysutils/qtpass
            echo "=== portlint"
            portlint -AC || true
            echo "=== fetch + checksum"
            make BATCH=yes checksum
            echo "=== makesum reproduces distinfo"
            grep -v TIMESTAMP distinfo > /tmp/distinfo.patch
            make BATCH=yes makesum
            grep -v TIMESTAMP distinfo > /tmp/distinfo.fresh
            diff /tmp/distinfo.patch /tmp/distinfo.fresh && echo "distinfo OK"
            echo "=== stage"
            make BATCH=yes stage
            echo "=== check-plist"
            make BATCH=yes check-plist
            echo "=== stage-qa"
            make BATCH=yes stage-qa
            echo "=== package + install"
            make BATCH=yes package
            pkg add work/pkg/qtpass-*.pkg
            pkg info qtpass | head -12
            ldd /usr/local/bin/qtpass | grep -E 'Qt6|GL'
            if [ "$RUN_SUITE" = "true" ]; then
              echo "=== upstream test suite on the port's build tree"
              cd work/.build
              QT_QPA_PLATFORM=offscreen make -j3 check 2>&1 | grep -E 'Totals|FAIL!' | awk '/Totals/{p+=$2;f+=$4;s+=$6;n++} /FAIL!/{print} END{print "suites="n" passed="p" failed="f" skipped="s; exit f>0}'
            fi

  # What a committer runs before pushing: poudriere testport in a clean jail
  # with only the port's declared dependencies. The job above pre-installs
  # the dependencies with pkg, so it cannot notice a missing *_DEPENDS; this
  # one can. Dependencies are fetched as packages from pkg.FreeBSD.org
  # (PACKAGE_FETCH_*) so only qtpass itself is built; a dependency whose
  # version in the ports tree is ahead of the package set gets built from
  # source, which is why the timeout is generous. The i386 jail runs natively
  # on the amd64 host (i386 packages exist for 14.x only). No other tier-2
  # architecture is reachable this way: pkg.FreeBSD.org publishes no ports
  # packages for powerpc64/powerpc64le, the armv7 set is stale, and riscv64
  # has no Qt6 anywhere, so each would mean building Qt6 under emulation.
  poudriere:
    name: poudriere testport FreeBSD ${{ matrix.release }} ${{ matrix.jail_arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14.5", jail_arch: amd64 }
          - { release: "15.1", jail_arch: amd64 }
          - { release: "14.5", jail_arch: i386 }
    env:
      PATCH: ${{ inputs.patch }}
      PORTS_REF: ${{ inputs.ports_ref || 'main' }}
      RELEASE: ${{ matrix.release }}
      JAIL_ARCH: ${{ matrix.jail_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the patch
        id: pick
        run: |
          set -eu
          if [ -z "${PATCH}" ]; then
            PATCH=$(ls patches/*.patch | sort -V | tail -1)
          fi
          test -f "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Testing $PATCH against ports/$PORTS_REF with poudriere"
      - name: poudriere testport in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          envs: "PORTS_REF RELEASE JAIL_ARCH"
          prepare: |
            pkg install -y git poudriere
          run: |
            set -e
            freebsd-version
            PATCH="$(pwd)/${{ steps.pick.outputs.patch }}"
            cat >> /usr/local/etc/poudriere.conf <<CONF
            NO_ZFS=yes
            BASEFS=/usr/local/poudriere
            DISTFILES_CACHE=/usr/local/poudriere/distfiles
            FREEBSD_HOST=https://download.FreeBSD.org
            USE_TMPFS=no
            ALLOW_MAKE_JOBS=yes
            PACKAGE_FETCH_BRANCH=latest
            PACKAGE_FETCH_WHITELIST="*"
            PACKAGE_FETCH_BLACKLIST="qtpass"
            CONF
            mkdir -p /usr/local/poudriere/distfiles /usr/local/etc/poudriere.d
            echo DEVELOPER=yes > /usr/local/etc/poudriere.d/make.conf
            echo "=== jail ${RELEASE}-RELEASE ${JAIL_ARCH}"
            poudriere jail -c -j rel -v "${RELEASE}-RELEASE" -a "${JAIL_ARCH}"
            echo "=== ports tree ${PORTS_REF}"
            poudriere ports -c -p main -m git+https -B "$PORTS_REF"
            cd /usr/local/poudriere/ports/main
            git log --oneline -1
            echo "=== apply the patch"
            if git apply --check "$PATCH"; then
              git apply "$PATCH"
            elif git apply --check --reverse "$PATCH"; then
              echo "patch is already in ports/$PORTS_REF; testing the tree as committed"
            else
              exit 1
            fi
            git status --short
            echo "=== testport"
            poudriere testport -j rel -p main -o sysutils/qtpass

  # The OpenBSD port, security/qtpass, has its own Makefile and PLIST, so it
  # gets its own patch (patches/openbsd/) and its own checks: makesum,
  # build, fake, update-plist, port-lib-depends-check, package, install.
  # The ports tree is -current (the GitHub mirror has no release branches)
  # on a release VM. The dependencies are pre-installed from the release
  # package mirror: -current's package names can be a revision ahead of the
  # release's (qttools-...pl0p0 vs pl0), so letting the framework fetch them
  # (FETCH_PACKAGES) misses and it builds Qt from source instead. The
  # dependency specs are version-free (qttools-*), so the installed release
  # packages satisfy them. Like the first FreeBSD job, this therefore cannot
  # notice a missing *_DEPENDS.
  openbsd:
    name: OpenBSD ${{ matrix.release }} amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ["7.9"]
    env:
      PATCH: ${{ inputs.openbsd_patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the patch
        id: pick
        run: |
          set -eu
          if [ -z "${PATCH}" ]; then
            PATCH=$(ls patches/openbsd/*.patch | sort -V | tail -1)
          fi
          test -f "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Testing $PATCH against OpenBSD ports -current"
      - name: Build and test the port in an OpenBSD VM
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: ${{ matrix.release }}
          usesh: true
          mem: 4096
          cpu: 3
          sync: rsync
          copyback: false
          prepare: |
            pkg_add -I git qtbase qttools desktop-file-utils gnupg password-store pwgen gtk+4-guic
          run: |
            set -e
            sysctl -n kern.version | head -1
            PATCH="$(pwd)/${{ steps.pick.outputs.patch }}"
            git clone --quiet --depth 1 https://github.com/openbsd/ports.git /usr/ports
            cd /usr/ports
            git log --oneline -1
            echo "=== apply the patch"
            if git apply --check "$PATCH"; then
              git apply "$PATCH"
            elif git apply --check --reverse "$PATCH"; then
              echo "patch is already in ports -current; testing the tree as committed"
            else
              exit 1
            fi
            git status --short
            # anything not pre-installed: pkg_add with default options (ports(7))
            echo FETCH_PACKAGES= >> /etc/mk.conf
            cd security/qtpass
            echo "=== portcheck"
            /usr/ports/infrastructure/bin/portcheck || true
            echo "=== makesum reproduces distinfo"
            cp distinfo /tmp/distinfo.patch
            make makesum
            diff /tmp/distinfo.patch distinfo && echo "distinfo OK"
            echo "=== build"
            make build
            echo "=== fake"
            make fake
            echo "=== update-plist reproduces PLIST"
            make update-plist
            git diff --exit-code pkg/ && echo "PLIST OK"
            echo "=== port-lib-depends-check"
            make port-lib-depends-check
            echo "=== package + install"
            make package
            make install
            pkg_info qtpass | head -8
            ldd /usr/local/bin/qtpass | grep -E 'Qt5|GL'
