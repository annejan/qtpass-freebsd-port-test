---
name: sysutils/qtpass port test

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  port:
    name: sysutils/qtpass 1.8.0 on FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14.5", arch: x86_64 }
          - { release: "15.1", arch: x86_64 }
          - { release: "14.5", arch: aarch64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stage the port in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y git portlint qt6-base qt6-tools qt6-svg qt6-translations password-store libglvnd gnupg
          run: |
            set -e
            freebsd-version
            WS="$(pwd)"
            git clone --quiet --depth 1 --filter=blob:none --sparse https://git.FreeBSD.org/ports.git /usr/ports
            cd /usr/ports
            git sparse-checkout set Mk Templates Keywords \
              sysutils/qtpass sysutils/password-store \
              devel/qt6-base devel/qt6-tools graphics/qt6-svg misc/qt6-translations \
              graphics/libglvnd
            git log --oneline -1
            echo "=== apply the Bugzilla patch as a patch"
            git apply --check "$WS/qtpass-1.8.0.patch"
            git apply "$WS/qtpass-1.8.0.patch"
            git status --short
            cd sysutils/qtpass
            echo "=== portlint"
            portlint -AC || true
            echo "=== fetch + checksum"
            make BATCH=yes checksum
            echo "=== makesum matches distinfo"
            cp distinfo /tmp/distinfo.patch && make BATCH=yes makesum && diff <(grep -v TIMESTAMP /tmp/distinfo.patch) <(grep -v TIMESTAMP distinfo) && echo "distinfo OK"
            echo "=== stage"
            make BATCH=yes stage
            echo "=== check-plist"
            make BATCH=yes check-plist
            echo "=== stage-qa"
            make BATCH=yes stage-qa
            echo "=== package + install"
            make BATCH=yes package
            pkg add work/pkg/qtpass-1.8.0.pkg
            pkg info qtpass | head -12
            ldd /usr/local/bin/qtpass | grep -E 'Qt6|GL'
            echo "=== upstream test suite on the port's build tree"
            cd work/.build && QT_QPA_PLATFORM=offscreen make -j3 check 2>&1 | grep -E 'Totals|FAIL!' | awk '/Totals/{p+=$2;f+=$4;s+=$6;n++} /FAIL!/{print} END{print "suites="n" passed="p" failed="f" skipped="s; exit f>0}'
