---
# Test bed for the FreeBSD port sysutils/qtpass.
#
# Applies a port patch (the same diff that goes to Bugzilla) to a fresh
# checkout of the FreeBSD ports tree inside a FreeBSD VM, then runs what a
# ports committer would: portlint, checksum/makesum, stage, check-plist,
# stage-qa, package + install, and QtPass's own test suite on the port's build
# tree. Matrix: amd64 on the current 14.x and 15.x releases, aarch64 on 14.x
# (emulated, slow). A second job runs poudriere testport on amd64, in a clean
# jail with only the port's declared dependencies.
name: sysutils/qtpass port test

on:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/port-test.yml"
  workflow_dispatch:
    inputs:
      patch:
        description: "Port patch to test (path in this repository)"
        required: true
        default: "patches/qtpass-1.8.0.patch"
      ports_ref:
        description: "FreeBSD ports branch to apply it to (main, 2026Q3, ...)"
        required: true
        default: "main"
      run_suite:
        description: "Run QtPass's test suite on the port's build tree"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  port:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14.5", arch: x86_64 }
          - { release: "15.1", arch: x86_64 }
          - { release: "14.5", arch: aarch64 }
    env:
      # On push the newest patch in patches/ is tested.
      PATCH: ${{ inputs.patch }}
      PORTS_REF: ${{ inputs.ports_ref || 'main' }}
      RUN_SUITE: ${{ inputs.run_suite == '' && 'true' || inputs.run_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the patch
        id: pick
        run: |
          set -eu
          if [ -z "${PATCH}" ]; then
            PATCH=$(ls patches/*.patch | sort -V | tail -1)
          fi
          test -f "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Testing $PATCH against ports/$PORTS_REF"
      - name: Build and test the port in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          envs: "PORTS_REF RUN_SUITE"
          prepare: |
            pkg install -y git portlint qt6-base qt6-tools qt6-svg qt6-translations password-store libglvnd gnupg desktop-file-utils
            # the stricter checks a committer runs (stage-qa, check-plist, ...)
            echo DEVELOPER=yes >> /etc/make.conf
          run: |
            set -e
            freebsd-version
            WS="$(pwd)"
            PATCH="$WS/${{ steps.pick.outputs.patch }}"
            git clone --quiet --depth 1 --branch "$PORTS_REF" --filter=blob:none --sparse https://git.FreeBSD.org/ports.git /usr/ports
            cd /usr/ports
            git sparse-checkout set Mk Templates Keywords \
              sysutils/qtpass sysutils/password-store \
              devel/qt6-base devel/qt6-tools graphics/qt6-svg misc/qt6-translations \
              graphics/libglvnd devel/desktop-file-utils
            git log --oneline -1
            echo "=== apply the patch"
            if git apply --check "$PATCH"; then
              git apply "$PATCH"
            elif git apply --check --reverse "$PATCH"; then
              echo "patch is already in ports/$PORTS_REF; testing the tree as committed"
            else
              exit 1
            fi
            git status --short
            cd sysutils/qtpass
            echo "=== portlint"
            portlint -AC || true
            echo "=== fetch + checksum"
            make BATCH=yes checksum
            echo "=== makesum reproduces distinfo"
            grep -v TIMESTAMP distinfo > /tmp/distinfo.patch
            make BATCH=yes makesum
            grep -v TIMESTAMP distinfo > /tmp/distinfo.fresh
            diff /tmp/distinfo.patch /tmp/distinfo.fresh && echo "distinfo OK"
            echo "=== stage"
            make BATCH=yes stage
            echo "=== check-plist"
            make BATCH=yes check-plist
            echo "=== stage-qa"
            make BATCH=yes stage-qa
            echo "=== package + install"
            make BATCH=yes package
            pkg add work/pkg/qtpass-*.pkg
            pkg info qtpass | head -12
            ldd /usr/local/bin/qtpass | grep -E 'Qt6|GL'
            if [ "$RUN_SUITE" = "true" ]; then
              echo "=== upstream test suite on the port's build tree"
              cd work/.build
              QT_QPA_PLATFORM=offscreen make -j3 check 2>&1 | grep -E 'Totals|FAIL!' | awk '/Totals/{p+=$2;f+=$4;s+=$6;n++} /FAIL!/{print} END{print "suites="n" passed="p" failed="f" skipped="s; exit f>0}'
            fi

  # What a committer runs before pushing: poudriere testport in a clean jail
  # with only the port's declared dependencies. The job above pre-installs
  # the dependencies with pkg, so it cannot notice a missing *_DEPENDS; this
  # one can. Dependencies are fetched as packages from pkg.FreeBSD.org
  # (PACKAGE_FETCH_*) so only qtpass itself is built; a dependency whose
  # version in the ports tree is ahead of the package set gets built from
  # source, which is why the timeout is generous. amd64 only: poudriere on
  # an emulated aarch64 VM is too slow to be useful.
  poudriere:
    name: poudriere testport FreeBSD ${{ matrix.release }} amd64
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    env:
      PATCH: ${{ inputs.patch }}
      PORTS_REF: ${{ inputs.ports_ref || 'main' }}
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the patch
        id: pick
        run: |
          set -eu
          if [ -z "${PATCH}" ]; then
            PATCH=$(ls patches/*.patch | sort -V | tail -1)
          fi
          test -f "$PATCH"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Testing $PATCH against ports/$PORTS_REF with poudriere"
      - name: poudriere testport in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          envs: "PORTS_REF RELEASE"
          prepare: |
            pkg install -y git poudriere
          run: |
            set -e
            freebsd-version
            PATCH="$(pwd)/${{ steps.pick.outputs.patch }}"
            cat >> /usr/local/etc/poudriere.conf <<CONF
            NO_ZFS=yes
            BASEFS=/usr/local/poudriere
            DISTFILES_CACHE=/usr/local/poudriere/distfiles
            FREEBSD_HOST=https://download.FreeBSD.org
            USE_TMPFS=no
            ALLOW_MAKE_JOBS=yes
            PACKAGE_FETCH_BRANCH=latest
            PACKAGE_FETCH_WHITELIST="*"
            PACKAGE_FETCH_BLACKLIST="qtpass"
            CONF
            mkdir -p /usr/local/poudriere/distfiles /usr/local/etc/poudriere.d
            echo DEVELOPER=yes > /usr/local/etc/poudriere.d/make.conf
            echo "=== jail ${RELEASE}-RELEASE"
            poudriere jail -c -j rel -v "${RELEASE}-RELEASE"
            echo "=== ports tree ${PORTS_REF}"
            poudriere ports -c -p main -m git+https -B "$PORTS_REF"
            cd /usr/local/poudriere/ports/main
            git log --oneline -1
            echo "=== apply the patch"
            if git apply --check "$PATCH"; then
              git apply "$PATCH"
            elif git apply --check --reverse "$PATCH"; then
              echo "patch is already in ports/$PORTS_REF; testing the tree as committed"
            else
              exit 1
            fi
            git status --short
            echo "=== testport"
            poudriere testport -j rel -p main -o sysutils/qtpass
